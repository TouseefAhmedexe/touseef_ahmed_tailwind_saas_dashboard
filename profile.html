<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloomrix SaaS - User Profile</title>
    <link rel="stylesheet" href="dist/output.css">
    <script src="js/theme.js" defer></script>
    <script src="js/profile.js" defer></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
    <header class="sticky top-0 z-50 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="text-2xl font-bold text-brand-500">Bloomrix</a>
            <nav class="hidden md:flex space-x-8">
                <a href="index.html" class="hover:text-brand-500 transition-colors">Home</a>
                <a href="pricing.html" class="hover:text-brand-500 transition-colors">Pricing</a>
                <a href="dashboard.html" class="hover:text-brand-500 transition-colors">Dashboard</a>
                <a href="profile.html" class="text-brand-500 font-semibold">Profile</a>
            </nav>
            <div class="flex items-center space-x-4">
                <button type="button" class="theme-toggle-btn p-2 rounded-lg border border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-300">Dark Theme</button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-4xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-10 space-y-8">
        <div id="alert-message" class="hidden p-4 rounded-lg bg-emerald-100 text-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-400 font-medium text-sm"></div>

        <div class="card space-y-6">
            <h1 class="text-xl font-bold border-b border-slate-200 dark:border-slate-700 pb-4">Personal Information</h1>
            <form id="profile-form" class="space-y-4">
                <div class="grid sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1" for="name">Full Name</label>
                        <input type="text" id="name" value="Touseef Ahmed" class="form-input" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1" for="email">Email Address</label>
                        <input type="email" id="email" value="touseefahmed9119@gmail.com" class="form-input" required>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1" for="phone">Phone Number</label>
                    <input type="tel" id="phone" value="03001234567" class="form-input" required>
                </div>
                <button type="submit" class="btn-primary">Save Profile</button>
            </form>
        </div>

        <div class="card space-y-6">
            <h2 class="text-xl font-bold border-b border-slate-200 dark:border-slate-700 pb-4">Change Password</h2>
            <form id="password-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1" for="current-password">Current Password</label>
                    <input type="password" id="current-password" class="form-input" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1" for="new-password">New Password</label>
                    <input type="password" id="new-password" class="form-input" minlength="8" required>
                </div>
                <button type="submit" class="btn-outline">Update Password</button>
            </form>
        </div>
    </main>
</body>
</html>
