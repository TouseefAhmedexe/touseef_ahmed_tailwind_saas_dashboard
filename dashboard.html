<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloomrix SaaS - Customer Dashboard</title>
    <link rel="stylesheet" href="dist/output.css">
    <script src="js/theme.js"></script>
    <script src="js/table.js" defer></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen flex">
    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden md:hidden"></div>

    <aside id="dashboard-sidebar" class="fixed md:static inset-y-0 left-0 z-50 w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 transform -translate-x-full md:translate-x-0 transition-transform duration-200 ease-in-out flex flex-col justify-between flex-shrink-0">
        <div>
            <div class="h-16 flex items-center justify-between px-6 font-bold text-xl text-brand-500 border-b border-slate-100 dark:border-slate-700/50">
                <span>Bloomrix Admin</span>
                <button id="sidebar-close-btn" type="button" class="md:hidden text-slate-500 hover:text-slate-700 dark:hover:text-slate-200 p-1 rounded-md" aria-label="Close sidebar">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <nav class="p-4 space-y-1" aria-label="Sidebar Navigation">
                <a href="dashboard.html" class="nav-link nav-link-active" aria-current="page">Dashboard</a>
                <a href="pricing.html" class="nav-link">Pricing</a>
                <a href="profile.html" class="nav-link">Profile</a>
                <a href="index.html" class="nav-link">Landing Page</a>
            </nav>
        </div>
        <div class="p-4 border-t border-slate-200 dark:border-slate-700">
            <div class="flex items-center space-x-3">
                <span class="w-9 h-9 rounded-full bg-brand-500 text-white font-bold flex items-center justify-center text-xs">TA</span>
                <div>
                    <div class="text-sm font-bold">Touseef Ahmed</div>
                    <div class="text-xs text-slate-500">Administrator</div>
                </div>
            </div>
        </div>
    </aside>

    <div class="flex-grow flex flex-col min-w-0">
        <header class="h-16 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-4 sm:px-8 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <button id="sidebar-toggle-btn" type="button" class="md:hidden p-2 rounded-lg border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-200" aria-expanded="false" aria-label="Open sidebar menu">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <h1 class="text-xl font-bold">Dashboard Overview</h1>
            </div>
            <div class="flex items-center space-x-4">
                <button type="button" class="theme-toggle-btn px-3 py-1.5 text-xs sm:text-sm rounded-lg border border-slate-300 dark:border-slate-700">🌙 Dark Mode</button>
            </div>
        </header>

        <main class="p-4 sm:p-8 flex-grow space-y-8">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <div class="card">
                    <span class="text-xs font-semibold text-slate-500 uppercase">Total Projects</span>
                    <div id="stat-total-projects" class="text-3xl font-extrabold mt-2">--</div>
                </div>
                <div class="card">
                    <span class="text-xs font-semibold text-slate-500 uppercase">Active Projects</span>
                    <div id="stat-active-projects" class="text-3xl font-extrabold mt-2 text-amber-600 dark:text-amber-400">--</div>
                </div>
                <div class="card">
                    <span class="text-xs font-semibold text-slate-500 uppercase">Completed Tasks</span>
                    <div id="stat-completed-tasks" class="text-3xl font-extrabold mt-2 text-emerald-600 dark:text-emerald-400">--</div>
                </div>
                <div class="card">
                    <span class="text-xs font-semibold text-slate-500 uppercase">Pending Tasks</span>
                    <div id="stat-pending-tasks" class="text-3xl font-extrabold mt-2 text-blue-600 dark:text-blue-400">--</div>
                </div>
            </div>

            <div class="grid lg:grid-cols-3 gap-8">
                <div class="lg:col-span-2 card space-y-4">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <h2 class="text-lg font-bold">Recent Projects & Transactions</h2>
                        <div class="flex items-center gap-3">
                            <label for="search-input" class="sr-only">Search projects</label>
                            <input type="text" id="search-input" placeholder="Search projects or IDs..." class="form-input text-sm w-48 sm:w-64">

                            <label for="status-filter" class="sr-only">Filter by status</label>
                            <select id="status-filter" class="form-input text-sm w-36">
                                <option value="all">All Status</option>
                                <option value="completed">Completed</option>
                                <option value="in progress">In Progress</option>
                                <option value="pending">Pending</option>
                            </select>
                        </div>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 text-xs text-slate-500 uppercase">
                                    <th scope="col" class="px-4 py-3">ID</th>
                                    <th scope="col" class="px-4 py-3">Project</th>
                                    <th scope="col" class="px-4 py-3">Client</th>
                                    <th scope="col" class="px-4 py-3">Date</th>
                                    <th scope="col" class="px-4 py-3">Amount</th>
                                    <th scope="col" class="px-4 py-3">Status</th>
                                </tr>
                            </thead>
                            <tbody id="table-body"></tbody>
                        </table>
                    </div>

                    <nav id="pagination" aria-label="Table pagination" class="flex justify-end gap-2 pt-2"></nav>
                </div>

                <div class="card space-y-4">
                    <h2 class="text-lg font-bold">Recent Activities</h2>
                    <ul id="activity-list" class="divide-y divide-slate-100 dark:divide-slate-700"></ul>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
