<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloomrix SaaS - Customer Dashboard</title>
    <link rel="stylesheet" href="dist/output.css">
    <script src="js/theme.js" defer></script>
    <script src="js/table.js" defer></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen flex">
    <aside class="w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 hidden md:block flex-shrink-0">
        <div class="h-16 flex items-center px-6 font-bold text-xl text-brand-500">Bloomrix Admin</div>
        <nav class="p-4 space-y-1">
            <a href="dashboard.html" class="block px-4 py-2.5 rounded-lg bg-brand-50 dark:bg-slate-700 text-brand-500 dark:text-white font-medium">Dashboard</a>
            <a href="pricing.html" class="block px-4 py-2.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">Pricing</a>
            <a href="profile.html" class="block px-4 py-2.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">Profile</a>
            <a href="index.html" class="block px-4 py-2.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">Landing Page</a>
        </nav>
    </aside>

    <div class="flex-grow flex flex-col min-w-0">
        <header class="h-16 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-4 sm:px-8 flex items-center justify-between">
            <h1 class="text-xl font-bold">Dashboard Overview</h1>
            <div class="flex items-center space-x-4">
                <button type="button" class="theme-toggle-btn px-3 py-1.5 text-sm rounded-lg border border-slate-300 dark:border-slate-700">Dark Theme</button>
                <div class="flex items-center space-x-2">
                    <span class="w-8 h-8 rounded-full bg-brand-500 text-white font-bold flex items-center justify-center text-xs">TA</span>
                    <span class="hidden sm:inline font-medium text-sm">Touseef Ahmed</span>
                </div>
            </div>
        </header>

        <main class="p-4 sm:p-8 flex-grow space-y-8">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <div class="card">
                    <span class="text-xs font-semibold text-slate-500 uppercase">Total Projects</span>
                    <div class="text-3xl font-extrabold mt-2">24</div>
                </div>
                <div class="card">
                    <span class="text-xs font-semibold text-slate-500 uppercase">Active Projects</span>
                    <div class="text-3xl font-extrabold mt-2 text-emerald-600 dark:text-emerald-400">10</div>
                </div>
                <div class="card">
                    <span class="text-xs font-semibold text-slate-500 uppercase">Completed Tasks</span>
                    <div class="text-3xl font-extrabold mt-2 text-blue-600 dark:text-blue-400">128</div>
                </div>
                <div class="card">
                    <span class="text-xs font-semibold text-slate-500 uppercase">Pending Tasks</span>
                    <div class="text-3xl font-extrabold mt-2 text-amber-600 dark:text-amber-400">5</div>
                </div>
            </div>

            <div class="grid lg:grid-cols-3 gap-8">
                <div class="lg:col-span-2 card space-y-4">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <h2 class="text-lg font-bold">Recent Projects & Transactions</h2>
                        <div class="flex items-center gap-3">
                            <input type="text" id="search-input" placeholder="Search projects..." class="form-input text-sm w-48 sm:w-64">
                            <select id="status-filter" class="form-input text-sm w-36">
                                <option value="all">All Status</option>
                                <option value="completed">Completed</option>
                                <option value="in progress">In Progress</option>
                                <option value="pending">Pending</option>
                            </select>
                        </div>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 text-xs text-slate-500 uppercase">
                                    <th class="px-4 py-3">ID</th>
                                    <th class="px-4 py-3">Project</th>
                                    <th class="px-4 py-3">Client</th>
                                    <th class="px-4 py-3">Date</th>
                                    <th class="px-4 py-3">Amount</th>
                                    <th class="px-4 py-3">Status</th>
                                </tr>
                            </thead>
                            <tbody id="table-body"></tbody>
                        </table>
                    </div>

                    <div class="flex justify-end pt-2" id="pagination"></div>
                </div>

                <div class="card space-y-4">
                    <h2 class="text-lg font-bold">Recent Activities</h2>
                    <ul id="activity-list" class="divide-y divide-slate-100 dark:divide-slate-700"></ul>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
